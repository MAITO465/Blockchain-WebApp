events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Angular SPA routing - fallback to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy /api calls to the Spring Boot backend container.
        # Use resolver + variable to force dynamic DNS re-resolution on each request.
        # This prevents 502 errors when the backend container IP changes after rebuild.
        # 10.89.1.1 = Podman internal DNS; 127.0.0.11 = Docker internal DNS.
        # Using 0.0.0.0 as fallback resolver forces Nginx to check /etc/resolv.conf.
        location /api {
            resolver 10.89.1.1 127.0.0.11 valid=5s ipv6=off;
            set $backend_upstream http://backend:8080;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Health check endpoint for Nginx itself
        location /nginx-health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
